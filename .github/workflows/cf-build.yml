# Cloudflare Workers build + deploy (OpenNext) in GitHub, never the laptop. Vercel Hobby disabled Oct 24 2026.
name: cf-build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: https://cortex.creativelynanda.co.za
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_WHATSAPP_NUMBER_DISPLAY: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER_DISPLAY }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      WHATSAPP_NUMBER_DISPLAY: ${{ secrets.WHATSAPP_NUMBER_DISPLAY }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion
      - name: Deploy + upload runtime secrets
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 bucket create cortex-hub-inc-cache || true
          npx opennextjs-cloudflare deploy
          node -e "const o={NEXT_PUBLIC_APP_URL:process.env.NEXT_PUBLIC_APP_URL};for(const k of process.argv.slice(1))if(process.env[k])o[k]=process.env[k];require('fs').writeFileSync('/tmp/s.json',JSON.stringify(o))" NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_WHATSAPP_NUMBER_DISPLAY SUPABASE_SERVICE_ROLE WHATSAPP_NUMBER_DISPLAY WHATSAPP_PHONE_ID WHATSAPP_TOKEN WHATSAPP_VERIFY_TOKEN OPENAI_API_KEY
          npx wrangler secret bulk /tmp/s.json
          rm -f /tmp/s.json
